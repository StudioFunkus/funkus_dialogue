[package]
name = "funkus_dialogue_editor"
version = "0.1.0"
edition = "2024"
description = "Extensible dialogue graph editor for Funkus Dialogue"
license = "Apache-2.0"
repository = "https://github.com/StudioFunkus/funkus_dialogue"
homepage = "https://github.com/StudioFunkus/funkus_dialogue"

[lib]
name = "funkus_dialogue_editor"
path = "src/lib.rs"

[dependencies]
bevy = { version = "0.18", default-features = false, features = ["default_app", "default_platform", "ui_api", "ui_bevy_render", "picking"] }
bevy_egui = { version = "0.39", default-features = false, features = ["render", "bevy_ui", "picking", "default_fonts", "manage_clipboard", "open_url"] }
egui-snarl = "0.9"
funkus_dialogue_core = { path = "../funkus_dialogue_core", version = "0.1.0" }
ron = "0.8"
rfd = "0.13"
serde_json = "1.0"
thiserror = "1.0"

[features]
default = ["image_formats_all"]
# Small but practical set for editor previews.
image_formats_basic = [
    "bevy/jpeg",
    "bevy/png",
    "bevy/webp",
]
# Full set of Bevy image formats for editor previews.
image_formats_all = [
    "image_formats_basic",
    "bevy/basis-universal",
    "bevy/bmp",
    "bevy/dds",
    "bevy/exr",
    "bevy/ff",
    "bevy/gif",
    "bevy/hdr",
    "bevy/ico",
    "bevy/ktx2",
    "bevy/pnm",
    "bevy/qoi",
    "bevy/tga",
    "bevy/tiff",
]
